let currentCategory = "All";
let cartCount = 0;
let liveProducts = [];
let searchToken = 0;

function money(n) {
 return "₹" + Number(n).toLocaleString("en-IN");
}

function escapeHTML(value) {
 return String(value).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function cardHTML(p) {
 const img = p.image || "";
 const safeName = escapeHTML(p.name);
 const price = Number.isFinite(p.price) ? money(p.price) : "Price unavailable";
 const rating = Number.isFinite(p.rating) ? p.rating : null;

 return `
 <div class="product-card">
  <div>
   <img src="${escapeHTML(img)}"
    alt="${safeName}"
    loading="lazy"
    onerror="this.onerror=null;this.src='https://placehold.co/400x300/f8f9fa/555?text=Image+Unavailable'">
   <div class="product-title">${safeName}</div>
   <div style="font-size:12px;color:#777;margin-bottom:6px">
    ${escapeHTML(p.category || "Components")}
   </div>
   ${rating === null ? "" :
    `<div class="rating">★ ${rating} <span>(${p.reviews || 0})</span></div>`}
   <div class="price-row">${price}</div>
   ${p.estimated ? '<div style="font-size:11px;color:#777;margin-bottom:8px">Indicative price; verify with seller.</div>' : ""}
   ${p.source ? `<a href="${escapeHTML(p.source)}" target="_blank" rel="noopener noreferrer" style="display:block;margin-bottom:10px;font-size:12px">View image source ↗</a>` : ""}
  </div>
  <button class="add-btn" onclick="addToCart(${Number(p.id)})">Add to Cart</button>
 </div>`;
}

function renderProducts(items) {
 const grid = document.getElementById("product-grid");

 if (!items.length) {
  grid.innerHTML = '<div style="grid-column:1/-1;background:white;padding:30px;text-align:center;color:#666">No matching components found. Try another search.</div>';
  return;
 }

 grid.innerHTML = items.map(cardHTML).join("");
}

function getSelectedPrices() {
 return [...document.querySelectorAll(".price-filter:checked")]
  .map(x => x.value);
}

function applyFilters() {
 const query = document.getElementById("search").value.trim().toLowerCase();
 const selectedPrices = getSelectedPrices();
 let list = [...products, ...liveProducts];

 list = list.filter(p => {
  const text = [p.name,p.category,p.terms,p.partNumber,p.description]
   .filter(Boolean).join(" ").toLowerCase();

  const matchesSearch = !query || text.includes(query);
  const matchesCategory = currentCategory === "All" ||
    p.category === currentCategory;

  let matchesPrice = true;
  if (selectedPrices.length) {
   if (!Number.isFinite(p.price)) {
    matchesPrice = false;
   } else {
    matchesPrice = selectedPrices.some(v => {
     if (v === "200") return p.price < 200;
     if (v === "500") return p.price >= 200 && p.price <= 500;
     if (v === "1000") return p.price > 500 && p.price <= 1000;
     if (v === "above") return p.price > 1000;
     return false;
    });
   }
  }
  return matchesSearch && matchesCategory && matchesPrice;
 });

 const mode = document.getElementById("sort-select").value;
 if (mode === "low-high") {
  list.sort((a,b) => (a.price ?? Infinity) - (b.price ?? Infinity));
 } else if (mode === "high-low") {
  list.sort((a,b) => (b.price ?? -Infinity) - (a.price ?? -Infinity));
 } else if (mode === "rating") {
  list.sort((a,b) => (b.rating ?? 0) - (a.rating ?? 0));
 }

 renderProducts(list);
}

function filterProducts() {
 applyFilters();

 // For a typed query, also look for public image matches.
 const q = document.getElementById("search").value.trim();
 if (q.length >= 2) {
  clearTimeout(window.imageSearchTimer);
  window.imageSearchTimer = setTimeout(() => searchPublicImages(q), 700);
 } else {
  liveProducts = [];
 }
}

function filterByCategory(category) {
 currentCategory = category;

 const radioMap = {
  "All":0,
  "Development Boards":1,
  "Sensors":2,
  "Components":3,
  "Robotics":4,
  "Communication":5,
  "Project Kits":6
 };

 const radios = document.querySelectorAll('input[name="cat"]');
 radios.forEach((radio,index) => {
  radio.checked = index === (radioMap[category] ?? -1);
 });

 applyFilters();
}

function sortProducts() {
 applyFilters();
}

function addToCart(id) {
 const p = [...products,...liveProducts].find(item => item.id === id);
 if (!p) return;

 cartCount++;
 document.getElementById("cart-count").textContent = cartCount;
 alert(p.name + " added to your cart.");
}

async function searchPublicImages(query) {
 const token = ++searchToken;
 const status = document.getElementById("product-grid");

 try {
  const params = new URLSearchParams({
   action:"query",
   generator:"search",
   gsrsearch:query + " electronic component",
   gsrnamespace:"6",
   gsrlimit:"15",
   prop:"imageinfo",
   iiprop:"url",
   iiurlwidth:"440",
   format:"json",
   origin:"*"
  });

  const response = await fetch(
   "https://commons.wikimedia.org/w/api.php?" + params.toString()
  );

  if (!response.ok) throw new Error("Image search failed");

  const data = await response.json();
  if (token !== searchToken) return;

  const pages = Object.values(data.query?.pages || {});
  const known = products.filter(p => {
   const text = (p.name + " " + p.terms).toLowerCase();
   return query.toLowerCase().split(/\s+/).some(word =>
    word.length > 1 && text.includes(word)
   );
  });

  const knownIds = new Set(known.map(p => p.id));
  liveProducts = [];

  pages.forEach((page,index) => {
   const info = page.imageinfo?.[0];
   if (!info || !info.thumburl) return;

   const name = page.title.replace(/^File:/,"");
   const alreadyShown = known.some(p =>
    p.name.toLowerCase() === name.toLowerCase()
   );
   if (alreadyShown) return;

   liveProducts.push({
    id:100000 + index,
    name:name,
    category:currentCategory === "All" ? "Components" : currentCategory,
    price:null,
    rating:null,
    reviews:0,
    image:info.thumburl,
    source:info.descriptionurl || info.url,
    terms:query,
    estimated:false
   });
  });

  // Keep catalogue products and live image matches together.
  applyFilters();

 } catch (error) {
  // Keep the original catalogue working even if the image service is unavailable.
  console.warn("Public image search unavailable",error);
 }
}

// Make catalogue item images use public image search if no image is supplied.
function enhanceMissingImages() {
 const missing = products.filter(p => !p.image);
 missing.forEach(p => {
  p.image = "https://placehold.co/400x300/f8f9fa/555?text=" +
    encodeURIComponent(p.name);
 });
}

// Initial page
enhanceMissingImages();
renderProducts(products);
</script>
